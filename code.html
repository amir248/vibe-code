<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code</title>
    <link rel="shortcut icon" href="img/ico.png" type="image/x-icon">
    <style>
        main{
            width:100%;
            max-width:700px;
            margin-left:auto;
            margin-right:auto;

        }
        .qr-code{
            /* height: 197px; */
            max-width: 197px;
            width:100%;
            overflow: hidden;
            opacity: 1;
            float: right;
            margin-left: 17px;
        }
        picture > img{
            float:right;
            max-width:197px;
            width:100%;
        }
        @media(max-width:400px){
            .qr-code{
                max-width:100%;
            }
            picture > img{
                max-width:100%;
                float:none;
            }
        }
        
    </style>
</head>
<body>
    <main>
        
</div>
        <h1>Реквизиты:</h1>
            <picture>
                <source srcset="img/qrCode700.avif"  type="image/avif">
                <source srcset="img/qrCode700.webp"  type="image/webp">
                <source srcset="img/qrCode700.png" type="image/png">
                <img src="img/qrCode.png" alt="qrCodeFromPayment" class="qr-code">

                </object> -->

            <p>ИНН банка: 7728168971</p>

</html>
